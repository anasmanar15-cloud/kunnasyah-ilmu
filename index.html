"id":"ketika-hati-resah","tajuk":"Ketika Hati Resah","jenis":"Risalah","siri":"tazkiyah","tarikh":"2026-11-09","status":"Terbit","pengarang":"Muhammad Anas Mohamad Zaid, Afaf Sukari","penerbit":"","ringkasan":"Risalah percuma yang menghimpunkan lima catatan ulama silam tentang kebimbangan, kesedihan dan rasa sempit dada, dan cara mereka bangkit daripadanya: Sufyan al-Thawri, Ibn Hazm, al-Ghazali, Ibn al-Jawzi dan Ibn Taymiyyah.","kandungan":"","pautan":"","pdf":"38faca4c36757a5b9e715c8a635092fb","kulit":"a434351bf245c6d345cec2a3328f18db","halaman":["41d4b97a73d2db9bef5c4de4a5b27bec","4524810024fa289251ef87fdb1573c47","dda6863de4eb7ca719c393e93333db3d","286089fafc69960667def80cc0307c29","4b6b895f51fd4612b4983e23fe1b65af","1898ccf79a5ccdcce9893c9dbca27c51","eaf0f780ea4a034223a125280dd3ea57","6ed27d30b2494c261f7275fb0d2f6563","d0845227158c6bbe7dc704b05298fac3","223e5aae8785a408755fc39c8c31acbd"],"tajukEn":"When the Heart Is Troubled","ringkasanEn":"A free booklet gathering five accounts by past scholars of anxiety, grief and tightness of the chest, and how they recovered from it: Sufyan al-Thawri, Ibn Hazm, al-Ghazali, Ibn al-Jawzi and Ibn Taymiyyah."},{"id":"pahala-zikir-faham-makna","tajuk":"Adakah Syarat Peroleh Pahala Zikir Perlu Faham Maknanya?","jenis":"Artikel","siri":"ibadah","tarikh":"2026-11-04","status":"Terbit","pengarang":"Muhammad Anas Mohamad Zaid","penerbit":"","ringkasan":"Berbeza dengan bacaan al-Quran, pahala zikir terikat dengan kefahaman maknanya. Memadai difahami secara umum, seperti mengetahui bahawa zikir itu mengagungkan Allah SWT, menurut Ibn Hajar al-Haytami dan al-Syubramallisi.","kandungan":"Perlu ditekankan terlebih dahulu bahawa yang menjadi perbahasan di sini ialah syarat mendapat pahala ketika berzikir.\n\n## Pahala Zikir Terikat dengan Memahami Maknanya\n\nLafaz atau ayat al-Quran itu ialah satu ibadah yang terzahir melalui pembacaan, berbeza dengan zikir yang tiada sifat tersebut pada lafaznya. Atas dasar ini ulama seperti Ibn Hajar al-Haytami, al-Bujayrimi, al-Qalyubi dan ramai lagi menetapkan bahawa orang yang berzikir mendapat pahala hanya jika dia memahami maknanya.\n\n(وَ) يُسَنُّ تَدَبُّرُ (الذِّكْرِ) كَالْقِرَاءَةِ وَقَضِيَّتُهُ حُصُولُ ثَوَابِهِ وَإِنْ جَهِلَ مَعْنَاهُ وَنَظَرَ فِيهِ الْإِسْنَوِيُّ وَلَا يَأْتِي هَذَا فِي الْقُرْآنِ لِلتَّعَبُّدِ بِلَفْظٍ فَأُثِيبَ قَارِئُهُ وَإِنْ لَمْ يَعْرِفْ مَعْنَاهُ بِخِلَافِ الذِّكْرِ لَا بُدَّ أَنْ يَعْرِفَهُ وَلَوْ بِوَجْهٍ\n\nMaksudnya: Sunat untuk mentadabur makna zikir sebagaimana bacaan al-Quran. Implikasi kenyataan ini ialah pahala zikir tetap diperoleh walaupun seseorang tidak mengetahui maknanya, namun al-Isnawi mempertikaikannya. Pertikaian ini tidak terpakai pada al-Quran kerana lafaznya sendiri dijadikan ibadat, maka pembacanya diberi pahala walaupun tidak diketahui maknanya. Hal ini berbeza dengan zikir yang mesti diketahui maknanya walaupun dari mana-mana sudut.\n\n*(Tuhfat al-Muhtaj, Maktabah Syamilah, jil. 2, hlm. 101)*\n\n## Kefahaman Makna yang Dimaksudkan\n\nMaksud tadabur atau memahami makna zikir dijelaskan oleh Ibn Hajar al-Haytami:\n\nأَيْ تَأَمُّلُ مَعَانِيهَا أَيْ إجْمَالًا لَا تَفْصِيلًا كَمَا هُوَ ظَاهِرٌ لِأَنَّهُ يَشْغَلُهُ عَمَّا هُوَ بِصَدَدِهِ\n\nMaksudnya: Iaitu dengan merenungi makna-maknanya secara umum, bukan secara terperinci, sebagaimana zahirnya. Hal ini kerana penelitian secara terperinci akan menyibukkan dirinya daripada perkara yang sedang dilakukannya.\n\n*(Tuhfat al-Muhtaj, Maktabah Syamilah, jil. 2, hlm. 101)*\n\nMaksud memahami zikir secara umum pula misalnya mengetahui bahawa zikir tersebut adalah untuk mengagungkan Allah SWT sepertimana yang diterangkan oleh al-Syubramallisi:\n\nوَمِنْ الْوَجْهِ الْكَافِي أَنْ يَتَصَوَّرَ أَنَّ فِي التَّسْبِيحِ وَالتَّحْمِيدِ وَنَحْوِهِمَا تَعْظِيمًا لِلَّهِ تَعَالَى أَوْ ثَنَاءً عَلَيْهِ\n\nMaksudnya: Antara bentuk penghayatan makna yang memadai ialah seseorang itu membayangkan bahawa dalam tasbih, tahmid dan seumpamanya terkandung pengagungan terhadap Allah SWT atau pujian kepada-Nya.\n\n*(Hasyiah al-Syubramallisi ‘ala Nihayat al-Muhtaj, Maktabah Syamilah, jil. 1, hlm. 548)*\n\nIni kerana memahami makna zikir secara khusus seperti mengetahui makna astaghfuirullah al-‘azim satu persatu akan mengganggu seseorang dari tujuan asalnya, iaitu berzikir.\n\n## Kesimpulan\n\nSeseorang yang berzikir perlu memahami makna zikir tersebut secara umum bagi memperoleh pahala, seperti tahu bahawa zikir itu menunjuk kepada kebesaran Allah SWT atau untuk mohon keampunan.","pautan":"","pdf":"aa3fecf2a85795a4d062453bcbc1e35e","infografik":"a4d03fc7124a89a852d351b3358b99f4","tajukEn":"Must One Understand the Meaning of Dhikr to Be Rewarded for It?","ringkasanEn":"Unlike recitation of the Quran, the reward of dhikr is tied to understanding its meaning. A general understanding suffices, such as knowing that the dhikr glorifies Allah, according to Ibn Hajar al-Haytami and al-Shubramallisi.","kandunganEn":"It should first be stressed that what is being discussed here is the condition for obtaining reward when performing dhikr.\n\n## The Reward of Dhikr Is Tied to Understanding Its Meaning\n\nThe words and verses of the Quran are themselves an act of worship expressed through recitation, unlike dhikr, whose wording does not carry that quality. On this basis, scholars such as Ibn Hajar al-Haytami, al-Bujayrimi, al-Qalyubi and many others held that a person performing dhikr is rewarded only if he understands its meaning.\n\n(وَ) يُسَنُّ تَدَبُّرُ (الذِّكْرِ) كَالْقِرَاءَةِ وَقَضِيَّتُهُ حُصُولُ ثَوَابِهِ وَإِنْ جَهِلَ مَعْنَاهُ وَنَظَرَ فِيهِ الْإِسْنَوِيُّ وَلَا يَأْتِي هَذَا فِي الْقُرْآنِ لِلتَّعَبُّدِ بِلَفْظٍ فَأُثِيبَ قَارِئُهُ وَإِنْ لَمْ يَعْرِفْ مَعْنَاهُ بِخِلَافِ الذِّكْرِ لَا بُدَّ أَنْ يَعْرِفَهُ وَلَوْ بِوَجْهٍ\n\nMeaning: It is recommended to reflect on the meaning of dhikr, just as with recitation of the Quran. The implication of this statement is that the reward of dhikr is obtained even if one does not know its meaning, but al-Isnawi questioned this. This objection does not apply to the Quran, because its very wording is made an act of worship, so its reciter is rewarded even without knowing its meaning. This differs from dhikr, whose meaning must be known, even if only in some respect.\n\n*(Tuhfat al-Muhtaj, Maktabah Shamilah, vol. 2, p. 101)*\n\n## The Understanding of Meaning Intended\n\nIbn Hajar al-Haytami explains what is meant by reflecting on or understanding the meaning of dhikr:\n\nأَيْ تَأَمُّلُ مَعَانِيهَا أَيْ إجْمَالًا لَا تَفْصِيلًا كَمَا هُوَ ظَاهِرٌ لِأَنَّهُ يَشْغَلُهُ عَمَّا هُوَ بِصَدَدِهِ\n\nMeaning: That is, contemplating its meanings in general, not in detail, as is apparent. This is because detailed examination would distract him from what he is engaged in.\n\n*(Tuhfat al-Muhtaj, Maktabah Shamilah, vol. 2, p. 101)*\n\nUnderstanding dhikr in general means, for example, knowing that the dhikr is a glorification of Allah, as al-Shubramallisi explains:\n\nوَمِنْ الْوَجْهِ الْكَافِي أَنْ يَتَصَوَّرَ أَنَّ فِي التَّسْبِيحِ وَالتَّحْمِيدِ وَنَحْوِهِمَا تَعْظِيمًا لِلَّهِ تَعَالَى أَوْ ثَنَاءً عَلَيْهِ\n\nMeaning: Among the forms of sufficient understanding is that a person conceives that tasbih, tahmid and the like contain a glorification of Allah or praise of Him.\n\n*(Hashiyat al-Shubramallisi 'ala Nihayat al-Muhtaj, Maktabah Shamilah, vol. 1, p. 548)*\n\nThis is because understanding the meaning of dhikr in detail, such as knowing the meaning of each word of astaghfirullah al-'azim one by one, would distract a person from his original purpose, which is to remember Allah.\n\n## Conclusion\n\nA person performing dhikr needs to understand its meaning in general in order to obtain the reward, such as knowing that the dhikr points to the greatness of Allah or is a plea for forgiveness."}],"blobs":{"38faca4c36757a5b9e715c8a635092fb":"assets/ketika-hati-resah.pdf?v=47c81009","a434351bf245c6d345cec2a3328f18db":"assets/ketika-hati-resah-kulit.jpg?v=9fb583fd","aa3fecf2a85795a4d062453bcbc1e35e":"assets/pahala-zikir-faham-makna.pdf?v=da3b377b","a4d03fc7124a89a852d351b3358b99f4":"assets/pahala-zikir-faham-makna-infografik.png?v=5978f415","41d4b97a73d2db9bef5c4de4a5b27bec":"assets/ketika-hati-resah-h01.jpg?v=77b185cc","4524810024fa289251ef87fdb1573c47":"assets/ketika-hati-resah-h02.jpg?v=5447587e","dda6863de4eb7ca719c393e93333db3d":"assets/ketika-hati-resah-h03.jpg?v=b7acb44a","286089fafc69960667def80cc0307c29":"assets/ketika-hati-resah-h04.jpg?v=605cf02d","4b6b895f51fd4612b4983e23fe1b65af":"assets/ketika-hati-resah-h05.jpg?v=626a59aa","1898ccf79a5ccdcce9893c9dbca27c51":"assets/ketika-hati-resah-h06.jpg?v=9a5aa202","eaf0f780ea4a034223a125280dd3ea57":"assets/ketika-hati-resah-h07.jpg?v=0fd4ab16","6ed27d30b2494c261f7275fb0d2f6563":"assets/ketika-hati-resah-h08.jpg?v=067e318b","d0845227158c6bbe7dc704b05298fac3":"assets/ketika-hati-resah-h09.jpg?v=fe4a0217","223e5aae8785a408755fc39c8c31acbd":"assets/ketika-hati-resah-h10.jpg?v=f6f9123a"}}</script>
